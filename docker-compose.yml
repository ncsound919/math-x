# Math X — Local development stack
# Usage: docker compose up
# Requires: Docker 24+, Docker Compose v2

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=development
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Pull models on startup
    # Run: docker compose exec ollama ollama pull qwen2.5-math
    # Run: docker compose exec ollama ollama pull deepseek-r1

volumes:
  ollama_data:
    driver: local
